<!-- Navigation Header -->
<nav class="fixed top-0 z-50 w-full flex justify-center h-[10%] pt-[10px] md:pt-2 transition-all duration-300">
  <div class="m-0 bg-gradient-to-b from-black/20 via-black/20 to-transparent backdrop-blur-lg rounded-t-[10px] md:rounded-t-[13px] px-4 md:px-8 max-w-[98%] md:max-w-[95%] lg:max-w-[80%] w-full relative overflow-visible pb-5 h-[80px]">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <div class="flex items-center space-x-3 hover:scale-105 transition-transform duration-200">
        <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center shadow-md">
          <svg class="w-6 h-6 text-purple-600" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <span class="text-xl font-bold text-white tracking-wide">{{ content.navigation.logo }}</span>
      </div>

      <!-- Desktop Navigation - Always visible on larger screens -->
      <div class="hidden lg:flex items-center space-x-8">
        @for (item of content.navigation.menu; track item.label) {
          <a [href]="item.href" 
             [class]="isActive(item.href) ? 'text-white font-semibold' : 'text-white/90 hover:text-white font-medium'"
             class="text-sm transition-all duration-200 relative group">
            {{ item.label }}
            <span 
              [class]="isActive(item.href) ? 'w-full bg-orange-400' : 'w-0 bg-white group-hover:w-full'"
              class="absolute -bottom-1 left-0 h-0.5 transition-all duration-200"></span>
          </a>
        }
      </div>

      <!-- Mobile menu button - Only on mobile and tablet -->
      <div class="lg:hidden">
        <button (click)="toggleMenu()" class="text-white hover:text-white/80 transition-colors duration-200 p-2">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" 
                  [attr.d]="isMenuOpen() ? 'M6 18L18 6M6 6l12 12' : 'M4 6h16M4 12h16M4 18h16'"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Navigation -->
    @if (isMenuOpen()) {
      <div class="lg:hidden">
        <div class="px-4 pt-2 pb-4 space-y-2 bg-black/70 backdrop-blur-md rounded-lg mt-2 border border-white/10">
          @for (item of content.navigation.menu; track item.label) {
            <a [href]="item.href" 
               (click)="closeMenu()"
               [class]="isActive(item.href) ? 'text-white bg-orange-500/20 border-l-2 border-orange-500' : 'text-white/90 hover:text-white hover:bg-white/10'"
               class="block px-3 py-2 rounded-lg text-base font-medium transition-all duration-200">
              {{ item.label }}
            </a>
          }
          
        </div>
      </div>
    }
  </div>
  
</nav>
